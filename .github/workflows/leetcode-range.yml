# Redraws the LeetCode mountain range once a day and publishes the SVGs to the `output`
# branch, which the README loads. Only public LeetCode profile data is read. If LeetCode
# can't be reached, the run fails and the previous drawing stays in place.
name: LeetCode range

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/mountains.py
      - .github/workflows/leetcode-range.yml

permissions:
  contents: write

concurrency:
  group: leetcode-range
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the range
        run: python scripts/mountains.py --leetcode user0498vT --out dist

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Redraw LeetCode range"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
