<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">Harsh Gupta</title>
  <desc id="d">Software developer, data and ML engineer. A climber walks a trail up a mountain at sunrise (light theme) or under the night sky (dark theme).</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b18"/><stop offset=".55" stop-color="#0e1c33"/><stop offset="1" stop-color="#22385a"/>
    </linearGradient>
    <linearGradient id="aur" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".35" stop-color="#34d399"/>
      <stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#f3efe0" stop-opacity=".35"/><stop offset="1" stop-color="#f3efe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff1c9" stop-opacity=".95"/><stop offset="1" stop-color="#ffd59e" stop-opacity="0"/></radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22385a" stop-opacity="0"/><stop offset="1" stop-color="#22385a" stop-opacity=".55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="type"><rect class="typing" x="64" y="168" width="0" height="34"/></clipPath>
    <style>
      .lbl{paint-order:stroke;stroke:#0a1220;stroke-width:4px;stroke-linejoin:round}
      .tw0{animation:tw 3s ease-in-out infinite}.tw1{animation:tw 4.2s ease-in-out .8s infinite}.tw2{animation:tw 5s ease-in-out 1.6s infinite}
      @keyframes tw{50%{opacity:.15}}
      .aurora{animation:aur 14s ease-in-out infinite alternate}
      @keyframes aur{from{transform:translateX(-40px) skewX(-4deg)}to{transform:translateX(40px) skewX(4deg)}}
      .shoot{opacity:0;animation:shoot 9s linear 2s infinite}
      @keyframes shoot{0%{opacity:0;transform:translate(0,0)}2%{opacity:1}6%{opacity:0;transform:translate(160px,53px)}100%{opacity:0}}
      .cloud{animation:drift 60s linear infinite}.c1{animation-duration:80s;animation-delay:-30s}.c2{animation-duration:70s;animation-delay:-50s}
      @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(260px)}}
      .bird{animation:fly 16s linear infinite}.b1{animation-delay:-.6s}.b2{animation-delay:-1.2s}
      @keyframes fly{from{transform:translate(-120px,20px)}50%{transform:translate(60px,-6px)}to{transform:translate(240px,14px)}}
      .trail{stroke-dasharray:2 7;animation:march 1.4s linear infinite}
      @keyframes march{to{stroke-dashoffset:-18}}
      .typing{animation:typing 3s steps(32) .5s forwards}
      @keyframes typing{to{width:380px}}
      .caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      .flag{transform-origin:900px 92px;animation:wave 1.6s ease-in-out infinite alternate}
      @keyframes wave{from{transform:skewY(-6deg) scaleX(.92)}to{transform:skewY(5deg) scaleX(1)}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.typing{width:380px}}
    </style>
  </defs>

  <rect width="1280" height="460" fill="url(#sky)"/>
  
  <g fill="#ffffff" opacity=".85"><circle cx="663" cy="242" r="0.9" class="tw0"/><circle cx="808" cy="166" r="0.7"/><circle cx="148" cy="210" r="0.7" class="tw2"/><circle cx="748" cy="149" r="0.7"/><circle cx="1039" cy="54" r="0.7" class="tw1"/><circle cx="176" cy="111" r="1.4"/><circle cx="143" cy="61" r="0.7" class="tw0"/><circle cx="1128" cy="108" r="0.7"/><circle cx="1158" cy="31" r="0.9" class="tw2"/><circle cx="1193" cy="242" r="0.7"/><circle cx="1181" cy="149" r="1.4" class="tw1"/><circle cx="101" cy="249" r="0.9"/><circle cx="95" cy="142" r="0.9" class="tw0"/><circle cx="593" cy="107" r="0.9"/><circle cx="1107" cy="30" r="1.1" class="tw2"/><circle cx="1147" cy="208" r="0.9"/><circle cx="211" cy="148" r="0.9" class="tw1"/><circle cx="762" cy="24" r="0.7"/><circle cx="1155" cy="15" r="0.9" class="tw0"/><circle cx="1016" cy="174" r="1.4"/><circle cx="643" cy="119" r="1.4" class="tw2"/><circle cx="740" cy="76" r="0.9"/><circle cx="368" cy="178" r="0.9" class="tw1"/><circle cx="167" cy="147" r="1.1"/><circle cx="1075" cy="126" r="1.1" class="tw0"/><circle cx="919" cy="73" r="0.7"/><circle cx="241" cy="131" r="1.4" class="tw2"/><circle cx="337" cy="193" r="1.1"/><circle cx="311" cy="238" r="1.4" class="tw1"/><circle cx="863" cy="10" r="0.7"/><circle cx="1142" cy="146" r="1.1" class="tw0"/><circle cx="696" cy="177" r="1.1"/><circle cx="1217" cy="127" r="1.4" class="tw2"/><circle cx="140" cy="215" r="0.7"/><circle cx="552" cy="121" r="0.7" class="tw1"/><circle cx="124" cy="187" r="1.1"/><circle cx="1183" cy="174" r="1.4" class="tw0"/><circle cx="582" cy="183" r="1.4"/><circle cx="710" cy="5" r="1.4" class="tw2"/><circle cx="727" cy="43" r="0.7"/><circle cx="1011" cy="15" r="0.9" class="tw1"/><circle cx="588" cy="33" r="0.9"/><circle cx="814" cy="100" r="1.4" class="tw0"/><circle cx="165" cy="42" r="1.4"/><circle cx="822" cy="140" r="1.1" class="tw2"/><circle cx="280" cy="209" r="1.4"/><circle cx="1126" cy="71" r="1.4" class="tw1"/><circle cx="734" cy="174" r="1.4"/><circle cx="472" cy="38" r="0.7" class="tw0"/><circle cx="360" cy="38" r="0.9"/><circle cx="477" cy="3" r="1.4" class="tw2"/><circle cx="1206" cy="46" r="1.1"/><circle cx="577" cy="1" r="0.9" class="tw1"/><circle cx="858" cy="136" r="1.1"/><circle cx="1248" cy="144" r="1.1" class="tw0"/><circle cx="257" cy="176" r="0.7"/><circle cx="935" cy="230" r="1.4" class="tw2"/><circle cx="815" cy="102" r="1.4"/><circle cx="212" cy="123" r="1.4" class="tw1"/><circle cx="127" cy="48" r="0.7"/><circle cx="427" cy="112" r="0.9" class="tw0"/><circle cx="225" cy="87" r="0.7"/><circle cx="209" cy="0" r="0.9" class="tw2"/><circle cx="1098" cy="25" r="1.1"/><circle cx="1256" cy="6" r="0.7" class="tw1"/><circle cx="425" cy="157" r="1.4"/><circle cx="304" cy="162" r="1.1" class="tw0"/><circle cx="711" cy="154" r="1.1"/><circle cx="971" cy="31" r="0.7" class="tw2"/><circle cx="999" cy="250" r="1.4"/></g>
  <g class="aurora" opacity=".38" filter="url(#blur8)">
    <path d="M520 40 C640 120 760 10 900 70 S1120 30 1280 90 V150 C1120 90 1000 150 880 120 S640 170 520 110Z" fill="url(#aur)"/>
  </g>
  <mask id="moonMask"><rect width="1280" height="460" fill="#fff"/><circle cx="1226" cy="62" r="30" fill="#000"/></mask>
  <circle cx="1214" cy="70" r="70" fill="url(#moonGlow)"/><circle cx="1214" cy="70" r="32" fill="#f3efe0" mask="url(#moonMask)"/>
  <path class="shoot" d="M300 60 l90 30" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <g class="cloud c0" opacity="0.45"><ellipse cx="380" cy="150" rx="90" ry="25.200000000000003" fill="#2c4061"/><ellipse cx="411.5" cy="137.4" rx="49.50000000000001" ry="21.599999999999998" fill="#2c4061"/></g><g class="cloud c1" opacity="0.35"><ellipse cx="760" cy="96" rx="70" ry="19.6" fill="#2c4061"/><ellipse cx="784.5" cy="86.2" rx="38.5" ry="16.8" fill="#2c4061"/></g><g class="cloud c2" opacity="0.4"><ellipse cx="1180" cy="170" rx="110" ry="30.800000000000004" fill="#2c4061"/><ellipse cx="1218.5" cy="154.6" rx="60.50000000000001" ry="26.4" fill="#2c4061"/></g>
