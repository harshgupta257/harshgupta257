  <!-- trail + climber -->
  <path d="M40 430 L150 426 L340 399 L480 350 L630 299 L770 220 L900 112" fill="none" stroke="#fbbf77" stroke-width="2.2" stroke-linecap="round" class="trail" opacity=".95"/>
  
  <g>
    <circle r="9" fill="#fbbf77" opacity=".35" class="pulse"/>
    <circle r="4.2" fill="#fbbf77" stroke="#0a1220" stroke-width="1.5"/>
    <animateMotion dur="16s" repeatCount="indefinite" path="M40 430 L150 426 L340 399 L480 350 L630 299 L770 220 L900 112" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear"/>
  </g>

  <!-- summit -->
  <line x1="900" y1="118" x2="900" y2="78" stroke="#eef3fa" stroke-width="2"/>
  <path class="flag" d="M901 79 L934 86 L901 94Z" fill="#fbbf77"/>

  <!-- name block -->
  <text x="64" y="82" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace" font-size="15" letter-spacing="2" fill="#7dd3fc" font-weight="700">hey there, I'm</text>
  <text x="60" y="140" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#eef3fa">Harsh Gupta</text>
  <g clip-path="url(#type)">
    <text x="64" y="192" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace" font-size="19" fill="#9fb3c8">$ building AI that actually ships</text>
  </g>
  <rect class="caret" x="424" y="176" width="10" height="20" fill="#7dd3fc" opacity=".9"/>
  <text x="64" y="226" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#eef3fa" opacity=".85">AI products  ·  NLP  ·  ML  ·  full-stack</text>
</svg>
